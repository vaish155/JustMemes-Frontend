name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push Frontend Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/justmemes/frontend:${{ github.sha }}"
          LATEST_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/justmemes/frontend:latest"
          
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE="${{ secrets.NEXT_PUBLIC_API_BASE || 'https://justmemes-backend-531422631456.asia-south1.run.app' }}" \
            -t $IMAGE_URI -t $LATEST_URI .
          
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy justmemes-frontend \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/justmemes/frontend:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated
